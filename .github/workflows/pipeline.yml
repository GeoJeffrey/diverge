name: pipeline

# The scheduled worker: scrape -> features -> indices -> integrity -> outlook -> publish to Neon.
# GitHub disables scheduled workflows in a public repo after 60 days without repository activity;
# re-enable it from the Actions tab (or push any commit). See DEPLOY.md.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, off the hour
  workflow_dispatch:
    inputs:
      full_publish:
        description: "Also re-publish every row (backfill), not just the last 3 days"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8   # Hugging Face uses its default cache, ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - name: Check the DATABASE_URL secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch (much smaller than the default wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # Sentiment model weights: one key per model, saved only on a miss. The model is the optional
      # repository variable DIVERGE_SENTIMENT_MODEL (e.g. the fine-tuned FinBERT on the Hugging Face
      # Hub); when it is unset the pipeline uses ProsusAI/finbert.
      - name: Restore Hugging Face model cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: diverge-hf-v1-${{ vars.DIVERGE_SENTIMENT_MODEL || 'ProsusAI-finbert' }}

      # The pipeline's working SQLite store (rolling history for Rn, z-scores, first-mention onsets).
      # Each run saves a new entry; the newest one is restored through the prefix.
      - name: Restore pipeline working store
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: diverge-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: diverge-data-

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIVERGE_SENTIMENT_MODEL: ${{ vars.DIVERGE_SENTIMENT_MODEL }}
        # --fail-on critical: a blocked scraper does not fail the run; features/outlook/publish do.
        run: python run_all.py --fail-on critical

      - name: Full publish (backfill)
        if: ${{ inputs.full_publish }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m diverge.publish --full

      - name: Save pipeline working store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: diverge-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Hugging Face model cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: diverge-hf-v1-${{ vars.DIVERGE_SENTIMENT_MODEL || 'ProsusAI-finbert' }}
