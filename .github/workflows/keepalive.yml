name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. Once a month this re-enables the pipeline and itself through the Actions API (the
# approach used by the keepalive-workflow action), so the 4-hourly pipeline keeps running.
# If it ever does get disabled anyway: Actions tab -> pipeline -> Enable workflow.
on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable the scheduled workflows
        run: |
          gh workflow enable pipeline.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
          gh workflow list --repo "$GITHUB_REPOSITORY"
