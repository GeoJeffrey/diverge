[project]
name = "diverge"
version = "1.0.0"
description = "Financial narrative intelligence: social-media sentiment, narrative contagion and coordinated-campaign detection, with a reproducible evaluation suite."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diverge.integrity" = ["learned_coordination_weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]